[package]
name = "deploy-to-vercel-action"
version = "2.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "deploy_to_vercel"
path = "src/lib.rs"

[[bin]]
name = "deploy-to-vercel"
path = "src/main.rs"

[dependencies]
dotenvy = "0.15.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "macros", "process", "io-util", "time"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "time"] }
wiremock = "0.6.5"

[profile.release]
codegen-units = 1
lto = true
strip = true
