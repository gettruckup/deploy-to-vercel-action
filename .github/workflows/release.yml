name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release without the leading v, e.g. 2.0.0 (must match Cargo.toml)'
        required: true
      move_major_tag:
        description: 'Also move the major tag (e.g. v2) to this release; false to canary the release first'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          # Dependency installs and builds run later in this job; don't leave a write credential in .git/config.
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version $VERSION"; exit 1; }
          [ "${VERSION%%.*}" -ge 2 ] || { echo "::error::refusing to release below v2 (would move v${VERSION%%.*})"; exit 1; }
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$crate" = "$VERSION" || { echo "::error::Cargo.toml has $crate, not $VERSION"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/v$VERSION" || { echo "::error::tag v$VERSION exists"; exit 1; }
      - name: Check
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          npm ci --prefix launcher
          node --test 'tests/shim/*.test.js'
      - name: Install cargo-zigbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/zigbuild"
          "$RUNNER_TEMP/zigbuild/bin/pip" install cargo-zigbuild==0.23.4 ziglang==0.17.0
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
      - name: Assemble dist/bin
        run: |
          mkdir -p dist/bin
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cp "target/$target/release/deploy-to-vercel" "dist/bin/deploy-to-vercel-$target"
            chmod 755 "dist/bin/deploy-to-vercel-$target"
          done
      - name: Build cli-install bundle
        run: |
          npm run build --prefix launcher
          node -e 'const m = require("./dist/cli-install.cjs"); if (typeof m.ensureVercelCli !== "function") process.exit(1)'
      - name: Smoke-test the x86_64 binary through the shim
        run: |
          set +e
          out=$(env -i PATH=/usr/bin:/bin INPUT_VERCEL_CLI_VERSION=false "$(command -v node)" dist/index.js)
          code=$?
          set -e
          # Print without letting the runner execute the binary's workflow commands.
          sed 's/^::/[cmd] ::/' <<<"$out"
          test "$code" -eq 1
          grep -F '::error::Input `GH_PAT,GITHUB_TOKEN` is required but was not provided.' <<<"$out"
      - name: Create release commit and tags
        env:
          VERSION: ${{ inputs.version }}
          MOVE_MAJOR: ${{ inputs.move_major_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          major="v${VERSION%%.*}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach
          git add -f dist/bin dist/cli-install.cjs
          git commit -m "Release v$VERSION"
          git tag "v$VERSION"
          # Checkout persisted no credential, so authenticate only these pushes.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" "refs/tags/v$VERSION:refs/tags/v$VERSION"
          if [ "$MOVE_MAJOR" = "true" ]; then
            git tag -f "$major"
            git push "$remote" "+refs/tags/$major:refs/tags/$major"
          else
            echo "Leaving $major where it is (move_major_tag=false)"
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" dist/bin/* --title "v$VERSION" --generate-notes
